<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">Como o pirlo funciona</title>
  <desc id="d">Você conversa com o líder. O líder roda o comando e manda a saída ao pirlo, ou pede uma leitura. O pirlo devolve saídas curtas direto e manda o resto para a fila de workers, que troca de marca quando uma fica sem cota. O worker devolve um resumo com arquivo:linha. Quando a cota do líder acaba, o pirlo deixa um passe pronto para outra IA.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #334155; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; fill: #1e293b; }
      .l { font-size: 12.5px; fill: #475569; }
      .ok { font-size: 12.5px; fill: #15803d; font-weight: 600; }
      .box { stroke-width: 1.5; }
      .line { stroke: #475569; stroke-width: 1.8; fill: none; }
      .back { stroke: #15803d; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="468" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- você -->
  <rect class="box" x="30" y="60" width="120" height="70" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="90" y="92" text-anchor="middle">você</text>
  <text class="s" x="90" y="113" text-anchor="middle">escreve normal</text>
  <path class="line" d="M150 95 H 205" marker-end="url(#a)"/>

  <!-- líder -->
  <rect class="box" x="210" y="40" width="210" height="110" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="315" y="70" text-anchor="middle">líder</text>
  <text class="s" x="315" y="92" text-anchor="middle">Claude Code, Codex,</text>
  <text class="s" x="315" y="110" text-anchor="middle">Antigravity, Kimi...</text>
  <text class="s" x="315" y="134" text-anchor="middle">planeja e decide</text>

  <!-- pedidos do líder -->
  <path class="line" d="M420 75 H 485" marker-end="url(#a)"/>
  <path class="line" d="M420 115 H 485" marker-end="url(#a)"/>
  <rect class="box" x="490" y="30" width="360" height="130" rx="12" fill="#eef4ff" stroke="#1d4ea0"/>
  <text class="h" x="510" y="56" fill="#1d4ea0">pirlo</text>
  <text class="m" x="510" y="82">npm test 2&gt;&amp;1 | pirlo digest</text>
  <text class="l" x="510" y="99">o líder roda, com as permissões dele</text>
  <text class="m" x="510" y="124">pirlo ask "o que o PDF diz de X?"</text>
  <text class="ok" x="510" y="147">saída curta? volta direto, sem worker</text>

  <!-- fila de workers -->
  <path class="line" d="M670 160 V 205" marker-end="url(#a)"/>
  <rect class="box" x="300" y="210" width="550" height="120" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="320" y="236">fila de workers, uma marca por vez</text>
  <text class="l" x="320" y="255">CLIs oficiais, só leitura</text>

  <rect x="320" y="270" width="130" height="40" rx="9" fill="#fff4e0" stroke="#f5a524"/>
  <text class="m" x="385" y="295" text-anchor="middle">agy · Gemini</text>
  <path class="line" d="M450 290 H 485" marker-end="url(#a)"/>
  <rect x="490" y="270" width="130" height="40" rx="9" fill="#e7f8ef" stroke="#34c27a"/>
  <text class="m" x="555" y="295" text-anchor="middle">codex · GPT</text>
  <path class="line" d="M620 290 H 655" marker-end="url(#a)"/>
  <rect x="660" y="270" width="170" height="40" rx="9" fill="#fdecec" stroke="#e45b5b"/>
  <text class="m" x="745" y="295" text-anchor="middle">native · Haiku</text>
  <text class="l" x="575" y="255" text-anchor="middle">sem cota? passa para o próximo</text>

  <!-- volta -->
  <path class="back" d="M300 270 H 260 V 155" marker-end="url(#g)"/>
  <text class="ok" x="140" y="215">resumo curto com</text>
  <text class="ok" x="140" y="233">arquivo:linha</text>

  <!-- rodapé: log e passe -->
  <rect x="30" y="360" width="400" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="h" x="50" y="388">log e economia</text>
  <text class="s" x="50" y="410">cada delegação vira uma linha em usage.jsonl;</text>
  <text class="s" x="50" y="428">pirlo savings estima o que o líder não leu</text>

  <rect x="450" y="360" width="400" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="h" x="470" y="388">passe</text>
  <text class="s" x="470" y="410">a cota do líder acabou? .pirlo/passe.md fica pronto</text>
  <text class="s" x="470" y="428">e a próxima IA continua de onde parou</text>
</svg>
