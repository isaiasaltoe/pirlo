<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
  <title id="t">Como o pirlo funciona</title>
  <desc id="d">Você pede ao líder para rodar os testes. O líder passa o trabalho braçal aos workers, os modelos leves das suas IAs, e recebe só um resumo com as falhas em arquivo:linha. Se um worker fica sem cota, o próximo assume. Se o líder fica sem cota, a próxima IA continua de onde ele parou.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #334155; }
      .l { font-size: 12.5px; fill: #475569; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; fill: #1e293b; }
      .r { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; fill: #14532d; }
      .box { stroke-width: 1.5; }
      .line { stroke: #475569; stroke-width: 1.8; fill: none; }
      .back { stroke: #15803d; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="328" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- você -->
  <rect class="box" x="30" y="50" width="140" height="80" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="100" y="84" text-anchor="middle">você</text>
  <text class="s" x="100" y="106" text-anchor="middle">"roda os testes"</text>
  <path class="line" d="M170 90 H 215" marker-end="url(#a)"/>

  <!-- líder -->
  <rect class="box" x="220" y="40" width="200" height="100" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="320" y="70" text-anchor="middle">líder</text>
  <text class="s" x="320" y="92" text-anchor="middle">a IA que você usa</text>
  <text class="s" x="320" y="116" text-anchor="middle">planeja e decide</text>

  <!-- trabalho braçal -->
  <path class="line" d="M420 75 H 525" marker-end="url(#a)"/>
  <text class="l" x="472" y="64" text-anchor="middle">trabalho braçal</text>

  <!-- workers -->
  <rect class="box" x="530" y="40" width="320" height="100" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h" x="550" y="66">workers</text>
  <text class="l" x="550" y="84">os modelos leves das suas IAs</text>
  <rect x="550" y="98" width="88" height="30" rx="8" fill="#fff4e0" stroke="#f5a524"/>
  <text class="m" x="594" y="118" text-anchor="middle">Gemini</text>
  <rect x="646" y="98" width="88" height="30" rx="8" fill="#e7f8ef" stroke="#34c27a"/>
  <text class="m" x="690" y="118" text-anchor="middle">GPT</text>
  <rect x="742" y="98" width="88" height="30" rx="8" fill="#fdecec" stroke="#e45b5b"/>
  <text class="m" x="786" y="118" text-anchor="middle">Haiku</text>

  <!-- resumo de volta -->
  <path class="back" d="M690 140 V 201 H 656" marker-end="url(#g)"/>
  <rect x="450" y="168" width="200" height="66" rx="10" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/>
  <text class="r" x="466" y="192" font-weight="700">só o resumo:</text>
  <text class="r" x="466" y="214">auth_test.rb:42 falhou</text>
  <path class="back" d="M450 201 H 320 V 146" marker-end="url(#g)"/>

  <!-- trocas de cota -->
  <rect x="30" y="258" width="400" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="s" x="50" y="288"><tspan font-weight="700">worker sem cota?</tspan> o próximo assume sozinho</text>
  <rect x="450" y="258" width="400" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="s" x="470" y="288"><tspan font-weight="700">líder sem cota?</tspan> a próxima IA continua de onde parou</text>
</svg>
